<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Task Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Project Board</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off" required name="task">
      <button type="submit">Add Task</button>
    </form>
  </header>

  <main class="board-container">

    <section class="column">
      <div class="column-header">
        <h2>To Do</h2>
      </div>
      <div class="card-container" id="todo-cards">
        <!-- Cards will be added here dynamically -->
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <h2>In Progress</h2>
      </div>
      <div class="card-container" id="in-progress-cards">
        <!-- Cards will be added here dynamically -->
      </div>
    </section>

    <section class="column">
      <div class="column-header">
        <h2>Completed</h2>
      </div>
      <div class="card-container" id="completed-cards">
        <!-- Cards will be added here dynamically -->
      </div>
    </section>
  </main>



  <script src="script.js"></script>
</body>

</html>
